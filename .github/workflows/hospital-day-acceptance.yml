name: Hospital Day Acceptance

on:
  pull_request:
    paths:
      - "apps/api/app/hospital_day_acceptance.py"
      - "apps/api/hospital_day_acceptance_smoke_test.py"
      - ".github/workflows/hospital-day-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/hospital_day_acceptance.py"
      - "apps/api/hospital_day_acceptance_smoke_test.py"
      - ".github/workflows/hospital-day-acceptance.yml"

concurrency:
  group: hospital-day-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hospital-day:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Run hospital-day acceptance proof
        run: python hospital_day_acceptance_smoke_test.py
