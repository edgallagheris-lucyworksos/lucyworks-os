name: Hospital Command Spine v9 Check

on:
  pull_request:
    paths:
      - "apps/api/app/hospital_command_*.py"
      - "apps/api/hospital_command_v9*_smoke_test.py"
      - "apps/api/migrations/versions/0010_*.py"
      - "apps/api/app/main.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/web/app/episode-command/**"
      - "apps/web/components/hospital-command-workspace.tsx"
      - "apps/web/app/system-control/page.tsx"
      - "scripts/restore-rehearsal.sh"
      - "docs/validation/HOSPITAL_COMMAND_SPINE_V9_RUNBOOK.md"
      - ".github/workflows/hospital-command-v9-ci.yml"
      - ".github/workflows/control-spine-ci.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/api/app/hospital_command_*.py"
      - "apps/api/hospital_command_v9*_smoke_test.py"
      - "apps/api/migrations/versions/0010_*.py"
      - "apps/api/app/main.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/web/app/episode-command/**"
      - "apps/web/components/hospital-command-workspace.tsx"
      - "apps/web/app/system-control/page.tsx"
      - "scripts/restore-rehearsal.sh"
      - "docs/validation/HOSPITAL_COMMAND_SPINE_V9_RUNBOOK.md"
      - ".github/workflows/hospital-command-v9-ci.yml"
      - ".github/workflows/control-spine-ci.yml"

jobs:
  api-and-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile hospital command modules
        run: python -m compileall -q app migrations
      - name: Run complete canonical episode command journey
        id: command_spine
        continue-on-error: true
        run: python hospital_command_v9_smoke_test.py > hospital-command-v9.log 2>&1
      - name: Run UTC, waiver, financial authority and early-closure hardening
        id: hardening
        continue-on-error: true
        run: python hospital_command_v9_hardening_smoke_test.py > hospital-command-v9-hardening.log 2>&1
      - name: Verify SQLite migration 0010
        id: migration
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-command-v9-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-command-v9-migration.db
          {
            alembic upgrade head
            python - <<'PY'
          from sqlalchemy import inspect, text
          from app.database import engine
          required = {
              "referralintakev9", "consentauthorisationv9", "episodehandoverv9",
              "episodecheckpointv9", "episodetransitionv9", "episodeclosurev9",
          }
          tables = set(inspect(engine).get_table_names())
          assert not (required - tables), sorted(required - tables)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          assert version == "0010_hospital_command_spine", version
          print("SQLite hospital command migration verified", version)
          PY
          } > command-migration.log 2>&1
      - name: Upload command API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-command-v9-api-logs
          path: |
            apps/api/hospital-command-v9.log
            apps/api/hospital-command-v9-hardening.log
            apps/api/command-migration.log
          if-no-files-found: error
      - name: Report command API failure
        if: steps.command_spine.outcome == 'failure' || steps.hardening.outcome == 'failure' || steps.migration.outcome == 'failure'
        run: |
          for file in hospital-command-v9.log hospital-command-v9-hardening.log command-migration.log; do
            echo "--- $file ---"
            cat "$file" || true
          done
          exit 1

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lucyworks
          POSTGRES_PASSWORD: lucyworks
          POSTGRES_DB: lucyworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucyworks -d lucyworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://lucyworks:lucyworks@localhost:5432/lucyworks_test
      AUTO_CREATE_SCHEMA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Apply PostgreSQL migration 0010
        id: postgres_migration
        continue-on-error: true
        run: alembic upgrade head > postgres-v9.log 2>&1
      - name: Verify PostgreSQL v9 tables
        id: postgres_verify
        if: steps.postgres_migration.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY' >> postgres-v9.log 2>&1
          from sqlalchemy import inspect, text
          from app.database import engine
          required = {
              "referralintakev9", "consentauthorisationv9", "episodehandoverv9",
              "episodecheckpointv9", "episodetransitionv9", "episodeclosurev9",
          }
          missing = required - set(inspect(engine).get_table_names())
          assert not missing, sorted(missing)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          assert version == "0010_hospital_command_spine", version
          print("PostgreSQL v9 schema verified", version)
          PY
      - name: Upload PostgreSQL v9 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-command-v9-postgres-log
          path: apps/api/postgres-v9.log
          if-no-files-found: error
      - name: Report PostgreSQL v9 failure
        if: steps.postgres_migration.outcome == 'failure' || steps.postgres_verify.outcome == 'failure'
        run: |
          cat postgres-v9.log || true
          exit 1

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Build hospital command workspace
        run: npm run build
