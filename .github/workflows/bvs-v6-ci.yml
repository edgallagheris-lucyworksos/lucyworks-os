name: BVS Configuration and Workforce v6 Check

on:
  pull_request:
    paths:
      - "apps/api/app/bvs_v6_*.py"
      - "apps/api/bvs_v6_*.py"
      - "apps/api/migrations/versions/0007_*.py"
      - "apps/api/app/main.py"
      - "apps/web/app/hospital-configuration/**"
      - "apps/web/app/workforce-rota/**"
      - "apps/web/components/bvs-configuration-workspace.tsx"
      - "apps/web/components/workforce-rota-workspace.tsx"
      - "apps/web/app/system-control/page.tsx"
      - "scripts/restore-rehearsal.sh"
      - ".github/workflows/bvs-v6-ci.yml"
      - ".github/workflows/control-spine-ci.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/api/app/bvs_v6_*.py"
      - "apps/api/bvs_v6_*.py"
      - "apps/api/migrations/versions/0007_*.py"
      - "apps/api/app/main.py"
      - "apps/web/app/hospital-configuration/**"
      - "apps/web/app/workforce-rota/**"
      - "apps/web/components/bvs-configuration-workspace.tsx"
      - "apps/web/components/workforce-rota-workspace.tsx"
      - "apps/web/app/system-control/page.tsx"
      - "scripts/restore-rehearsal.sh"
      - ".github/workflows/bvs-v6-ci.yml"
      - ".github/workflows/control-spine-ci.yml"

jobs:
  api-and-migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile BVS v6 modules
        run: python -m compileall -q app migrations
      - name: Run BVS configuration and referral test
        run: python bvs_v6_smoke_test.py
      - name: Run BVS rota and safe staffing test
        run: python bvs_v6_rota_smoke_test.py
      - name: Verify SQLite migration 0007 and tables
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-bvs-v6-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-bvs-v6-migration.db
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import inspect, text
          from app.database import engine
          tables = set(inspect(engine).get_table_names())
          required = {
              "hospitalconfigurationrecord", "configurationclaim", "configurationverificationtask",
              "workforceprofile", "workforcecompetency", "coveragerequirement",
              "workforceshiftv6", "workforceavailabilityexceptionv6",
              "referralintake", "referralintakeevent", "historicalreplayrun", "historicalreplayevent",
          }
          missing = required - tables
          assert not missing, sorted(missing)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          assert version == "0007_bvs_config_workforce", version
          print("BVS v6 SQLite migration verified", version)
          PY

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production web application
        run: npm run build
