name: Day Control Check

on:
  pull_request:
    paths:
      - "apps/api/app/day_control*.py"
      - "apps/api/day_control_smoke_test.py"
      - ".github/workflows/day-control-check.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/day_control*.py"
      - "apps/api/day_control_smoke_test.py"
      - ".github/workflows/day-control-check.yml"

jobs:
  day-control-smoke:
    runs-on: ubuntu-latest
    env:
      # This job intentionally exercises the retired whole-board replacement
      # fixture. No production or normal development process may set this.
      LUCYWORKS_LEGACY_TEST_BYPASS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt

      - name: Run retained day-control smoke test
        working-directory: apps/api
        run: python day_control_smoke_test.py
