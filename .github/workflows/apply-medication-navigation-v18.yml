name: Apply Medication Navigation v18

on:
  push:
    branches:
      - feature/medication-foundation-v18
    paths:
      - ".github/workflows/apply-medication-navigation-v18.yml"
      - "scripts/apply_medication_navigation_v18.py"
      - "scripts/harden_medication_foundation_v18.py"

permissions:
  contents: write

jobs:
  apply-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/medication-foundation-v18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Apply deterministic medication transformations
        run: |
          python scripts/apply_medication_navigation_v18.py
          python scripts/harden_medication_foundation_v18.py
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile medication foundation
        working-directory: apps/api
        run: python -m py_compile app/medication_foundation_v18_models.py app/medication_foundation_v18_routes.py medication_foundation_v18_smoke_test.py migrations/versions/0013_medication_foundation_v18.py
      - name: Run connected medication proof
        working-directory: apps/api
        run: python medication_foundation_v18_smoke_test.py
      - name: Run migration chain through v18
        working-directory: apps/api
        run: |
          rm -f /tmp/lucyworks-medication-v18-migration.db
          DATABASE_URL=sqlite:////tmp/lucyworks-medication-v18-migration.db alembic upgrade head
          version="$(DATABASE_URL=sqlite:////tmp/lucyworks-medication-v18-migration.db python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine('sqlite:////tmp/lucyworks-medication-v18-migration.db')
          with engine.connect() as connection:
              print(connection.execute(text('select version_num from alembic_version')).scalar_one())
          PY
          )"
          test "$version" = "0013_medication_v18"
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build medication workspaces
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "lucyworks-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/app/medication_foundation_v18_routes.py apps/web/app/system-control/page.tsx apps/web/components/care-brief-v16.tsx apps/web/app/clinical-execution/page.tsx apps/web/components/detailed-patient-record-workspace.tsx
          git diff --cached --quiet && { echo "Medication transformation produced no changes"; exit 1; }
          git commit -m "Harden and connect medication safety workflow v18"
          git push origin HEAD:feature/medication-foundation-v18

# Explicit trigger after backend review and terminology hardening.
