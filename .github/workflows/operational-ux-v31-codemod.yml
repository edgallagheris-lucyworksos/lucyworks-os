name: Operational UX v31 Codemod

on:
  push:
    branches: ["feature/operational-ux-real-uat-v31"]
    paths:
      - "scripts/apply_operational_ux_v31.py"
      - ".github/workflows/operational-ux-v31-codemod.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operational-ux-real-uat-v31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic codemod
        run: python scripts/apply_operational_ux_v31.py
      - name: Commit generated source corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No codemod changes"
            exit 0
          fi
          git config user.name "lucyworks-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web
          git commit -m "Apply v31 authenticated API and local-date corrections"
          git push origin HEAD:feature/operational-ux-real-uat-v31
