name: LucyWorks Verified Build

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/integrations/**"
      - "config/compliance/**"
      - "deploy/**"
      - "scripts/production-*.sh"
      - "scripts/restore-rehearsal.sh"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/control-spine-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/integrations/**"
      - "config/compliance/**"
      - "deploy/**"
      - "scripts/production-*.sh"
      - "scripts/restore-rehearsal.sh"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/control-spine-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production mappings and scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("config/integrations").glob("*.mapping.json"))
          assert len(files) >= 4, files
          for path in files:
              payload = json.loads(path.read_text())
              assert payload["profileVersion"] == 1
              assert payload["requiredFields"]
              assert payload["fieldMappings"]
          compliance = json.loads(Path("config/compliance/uk-veterinary-compliance-safety-v10.json").read_text())
          assert compliance["baselineId"] == "uk-veterinary-compliance-safety-v10"
          assert len(compliance["obligations"]) >= 15
          assert len(compliance["identityGroups"]) >= 10
          assert len(compliance["vendorContracts"]) == 6
          print("validated production mappings and compliance baseline")
          PY
          bash -n scripts/production-preflight.sh scripts/production-backup.sh scripts/restore-rehearsal.sh
      - name: Build API production image
        id: api_image
        continue-on-error: true
        run: docker build --progress=plain -t lucyworks-api-ci apps/api > api-image.log 2>&1
      - name: Build web production image
        id: web_image
        continue-on-error: true
        run: docker build --progress=plain --build-arg API_INTERNAL_BASE=http://api:8000 -f apps/web/Dockerfile -t lucyworks-web-ci . > web-image.log 2>&1
      - name: Upload production image logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-logs
          path: |
            api-image.log
            web-image.log
          if-no-files-found: error
      - name: Report image build failure
        if: steps.api_image.outcome == 'failure' || steps.web_image.outcome == 'failure'
        run: |
          echo "--- API image ---"
          tail -n 300 api-image.log || true
          echo "--- Web image ---"
          tail -n 300 web-image.log || true
          exit 1
      - name: Validate production Compose stack
        run: |
          cat > deploy/.env.production <<'EOF'
          DEPLOYMENT_ENVIRONMENT=production
          AUTH_MODE=oidc
          AUTH_ENFORCEMENT=required
          AUTH_DEV_LOGIN_ENABLED=false
          AUTH_RETURN_BEARER_DEV=false
          AUTH_SESSION_MINUTES=480
          AUTH_IDLE_MINUTES=30
          AUTH_AUDIENCE=lucyworks-api
          OIDC_ISSUER=https://identity.invalid/
          OIDC_JWKS_URL=https://identity.invalid/keys
          OIDC_AUTHORIZATION_URL=https://identity.invalid/authorize
          OIDC_TOKEN_URL=https://identity.invalid/token
          OIDC_CLIENT_ID=ci-client
          OIDC_CLIENT_SECRET=ci-secret-not-used-at-runtime
          AUTH_ROLE_MAP={"ci":"admin"}
          AUTO_CREATE_SCHEMA=false
          SECURITY_HEADERS_ENABLED=true
          RATE_LIMIT_ENABLED=true
          LEGACY_WRITE_MODE=block
          LUCYWORKS_LEGACY_TEST_BYPASS=false
          METRICS_API_KEY=ci-metrics-key-not-used-at-runtime
          EOF
          PUBLIC_DOMAIN=ci.example.invalid POSTGRES_PASSWORD=ci-database-password docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config >/tmp/lucyworks-compose.yml
