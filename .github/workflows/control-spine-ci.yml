name: LucyWorks Verified Build

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/**"
      - "deploy/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "config/**"
      - "deploy/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"

jobs:
  api-smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile API modules
        run: python -m compileall -q app migrations
      - name: Run complete API regression suite
        id: api_suite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          run_test() {
            local script="$1"
            local log="$2"
            echo "=== $script ===" | tee "$log"
            python "$script" 2>&1 | tee -a "$log"
          }
          run_test v7_consolidation_smoke_test.py v7-consolidation.log
          run_test clinical_execution_smoke_test.py clinical-execution.log
          run_test detailed_hospital_v8_smoke_test.py detailed-v8.log
          run_test detailed_hospital_completion_smoke_test.py detailed-completion.log
          run_test hospital_command_v9_smoke_test.py hospital-command-v9.log
          run_test hospital_command_v9_hardening_smoke_test.py hospital-command-v9-hardening.log
          run_test bvs_v6_smoke_test.py bvs-v6.log
          run_test bvs_v6_rota_smoke_test.py bvs-rota-v6.log
          run_test production_readiness_smoke_test.py production-readiness.log
          run_test hospital_ops_v3_smoke_test.py hospital-ops-v3.log
          run_test auth_identity_smoke_test.py identity.log
          run_test integration_smoke_test.py integrations.log
          LUCYWORKS_LEGACY_TEST_BYPASS=true python control_spine_smoke_test.py 2>&1 | tee control-spine.log
          LUCYWORKS_LEGACY_TEST_BYPASS=true python evidence_patient_care_smoke_test.py 2>&1 | tee patient-evidence.log
      - name: Run SQLite migration chain through 0010
        id: sqlite_migration
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-migration.db
          alembic upgrade head 2>&1 | tee migration.log
          alembic current 2>&1 | tee -a migration.log
          grep -q "0010_hospital_command_spine" migration.log
      - name: Upload API validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-api-logs
          path: |
            apps/api/v7-consolidation.log
            apps/api/clinical-execution.log
            apps/api/detailed-v8.log
            apps/api/detailed-completion.log
            apps/api/hospital-command-v9.log
            apps/api/hospital-command-v9-hardening.log
            apps/api/bvs-v6.log
            apps/api/bvs-rota-v6.log
            apps/api/production-readiness.log
            apps/api/hospital-ops-v3.log
            apps/api/identity.log
            apps/api/integrations.log
            apps/api/control-spine.log
            apps/api/patient-evidence.log
            apps/api/migration.log
          if-no-files-found: error
      - name: Report API validation failure
        if: steps.api_suite.outcome == 'failure' || steps.sqlite_migration.outcome == 'failure'
        run: |
          for file in *.log; do
            echo "--- $file ---"
            tail -n 300 "$file" || true
          done
          exit 1

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lucyworks
          POSTGRES_PASSWORD: lucyworks
          POSTGRES_DB: lucyworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucyworks -d lucyworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://lucyworks:lucyworks@localhost:5432/lucyworks_test
      AUTO_CREATE_SCHEMA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head 2>&1 | tee postgres-migration.log
      - name: Verify PostgreSQL schema version and critical tables
        run: |
          python - <<'PY' 2>&1 | tee -a postgres-migration.log
          from sqlalchemy import inspect, text
          from app.database import engine

          required = {
              "evidenceevent", "approvaltask", "accountablehandover", "compliancecontrol",
              "serviceavailability", "aimodelregistration", "criticalresultacknowledgement",
              "integrationconnection", "integrationenvelope", "integrationentitylink",
              "hospitalpremises", "operationalarea", "canonicalepisodestate", "operationalblock",
              "operationaldependency", "operationalcommand", "operationalconflict", "boardchangeevent",
              "scenariorun", "importbatch", "importreconciliationitem",
              "readinesscontrol", "readinessevidence", "securityassessmentrun", "pilotrun", "pilotobservation",
              "hospitalconfigurationrecord", "configurationclaim", "configurationverificationtask",
              "workforceprofile", "workforcecompetency", "coveragerequirement", "workforceshiftv6",
              "workforceavailabilityexceptionv6", "referralintake", "referralintakeevent",
              "historicalreplayrun", "historicalreplayevent", "authsession", "durableevent",
              "eventacknowledgement", "canonicalshadowcomparison", "integrationretryjob",
              "legacywriteretirement", "medicationorder", "medicationadministration", "anaesthesiarecord",
              "clinicalobservation", "treatmenttask", "controlleddrugledgerentry", "inventoryitem",
              "inventorymovement", "diagnosticworkitem", "samplechainevent", "dischargeplan",
              "owneraccountv8", "patientclinicalrecordv8", "patientownerlinkv8", "patientproblemv8",
              "patientallergyv8", "patientweightv8", "clinicalencounterv8", "clinicalnotev8",
              "formularymedicinev8", "formularydoserulev8", "medicationsafetyreviewv8",
              "anaesthesiachartv8", "anaesthesiaobservationv8", "anaesthesiadrugeventv8",
              "fluidplanv8", "fluidbalanceentryv8", "inpatientcareplanv8", "inpatientchartentryv8",
              "procedurerecordv8", "implanttracev8", "estimatev8", "estimatelinev8",
              "insurancecasev8", "financialtransactionv8", "communicationeventv8", "clinicaldocumentv8",
              "referralintakev9", "consentauthorisationv9", "episodehandoverv9",
              "episodecheckpointv9", "episodetransitionv9", "episodeclosurev9", "alembic_version",
          }
          tables = set(inspect(engine).get_table_names())
          missing = required - tables
          assert not missing, f"missing PostgreSQL tables: {sorted(missing)}"
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          assert version == "0010_hospital_command_spine", version
          print("PostgreSQL hospital command migration verified", version)
          PY
      - name: Prove operational stale-write protection
        run: python hospital_ops_postgres_concurrency_test.py 2>&1 | tee -a postgres-migration.log
      - name: Prove durable event sequence concurrency
        run: python v7_event_postgres_concurrency_test.py 2>&1 | tee -a postgres-migration.log
      - name: Upload PostgreSQL migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-log
          path: apps/api/postgres-migration.log
          if-no-files-found: error

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        id: web_build
        continue-on-error: true
        run: npm run build > web-build.log 2>&1
      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-log
          path: apps/web/web-build.log
          if-no-files-found: error
      - name: Report web build failure
        if: steps.web_build.outcome == 'failure'
        run: tail -n 300 web-build.log && exit 1

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate mappings and operational scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("config/integrations").glob("*.mapping.json"))
          assert len(files) >= 4, files
          for path in files:
              payload = json.loads(path.read_text())
              assert payload["profileVersion"] == 1
              assert payload["requiredFields"]
              assert payload["fieldMappings"]
          print("validated mapping profiles", len(files))
          PY
          bash -n scripts/production-preflight.sh scripts/production-backup.sh scripts/restore-rehearsal.sh scripts/failure-drill-v7.sh
          python -m py_compile scripts/security-probe.py scripts/load-test-v7.py
      - name: Build API production image
        id: api_image
        continue-on-error: true
        run: docker build --progress=plain -t lucyworks-api-ci apps/api > api-image.log 2>&1
      - name: Build web production image
        id: web_image
        continue-on-error: true
        run: docker build --progress=plain --build-arg API_INTERNAL_BASE=http://api:8000 -f apps/web/Dockerfile -t lucyworks-web-ci . > web-image.log 2>&1
      - name: Upload production image logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-logs
          path: |
            api-image.log
            web-image.log
          if-no-files-found: error
      - name: Report image build failure
        if: steps.api_image.outcome == 'failure' || steps.web_image.outcome == 'failure'
        run: |
          echo "--- API image ---"
          tail -n 300 api-image.log || true
          echo "--- Web image ---"
          tail -n 300 web-image.log || true
          exit 1
      - name: Validate production Compose stack
        run: |
          cat > deploy/.env.production <<'EOF'
          DEPLOYMENT_ENVIRONMENT=production
          AUTH_MODE=oidc
          AUTH_ENFORCEMENT=required
          AUTH_DEV_LOGIN_ENABLED=false
          AUTH_RETURN_BEARER_DEV=false
          AUTH_SESSION_MINUTES=480
          AUTH_IDLE_MINUTES=30
          AUTH_AUDIENCE=lucyworks-api
          OIDC_ISSUER=https://identity.invalid/
          OIDC_JWKS_URL=https://identity.invalid/keys
          OIDC_AUTHORIZATION_URL=https://identity.invalid/authorize
          OIDC_TOKEN_URL=https://identity.invalid/token
          OIDC_CLIENT_ID=ci-client
          OIDC_CLIENT_SECRET=ci-secret-not-used-at-runtime
          AUTH_ROLE_MAP={"ci":"admin"}
          AUTO_CREATE_SCHEMA=false
          SECURITY_HEADERS_ENABLED=true
          RATE_LIMIT_ENABLED=true
          LEGACY_WRITE_MODE=block
          LUCYWORKS_LEGACY_TEST_BYPASS=false
          METRICS_API_KEY=ci-metrics-key-not-used-at-runtime
          EOF
          PUBLIC_DOMAIN=ci.example.invalid POSTGRES_PASSWORD=ci-database-password docker compose --env-file deploy/.env.production -f deploy/docker-compose.production.yml config >/tmp/lucyworks-compose.yml
