name: External Adapter Runtime

on:
  pull_request:
    paths:
      - "apps/api/app/external_system_acceptance.py"
      - "apps/api/app/external_system_adapter_runtime.py"
      - "apps/api/external_system_adapter_runtime_smoke_test.py"
      - ".github/workflows/external-adapter-runtime.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/external_system_acceptance.py"
      - "apps/api/app/external_system_adapter_runtime.py"
      - "apps/api/external_system_adapter_runtime_smoke_test.py"
      - ".github/workflows/external-adapter-runtime.yml"

concurrency:
  group: external-adapter-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile adapter runtime
        run: python -m py_compile app/external_system_adapter_runtime.py
      - name: Prove inbound adapter behaviour
        run: python external_system_adapter_runtime_smoke_test.py
