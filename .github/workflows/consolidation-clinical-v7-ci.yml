name: Consolidation and Clinical Execution v7 Check

on:
  pull_request:
    paths:
      - "apps/api/app/auth*.py"
      - "apps/api/app/v7_*.py"
      - "apps/api/app/clinical_execution*.py"
      - "apps/api/app/integration_retry*.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/api/v7_*.py"
      - "apps/api/clinical_execution_smoke_test.py"
      - "apps/api/migrations/versions/*.py"
      - "apps/web/**"
      - "scripts/load-test-v7.py"
      - "scripts/failure-drill-v7.sh"
      - ".github/workflows/consolidation-clinical-v7-ci.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/api/app/auth*.py"
      - "apps/api/app/v7_*.py"
      - "apps/api/app/clinical_execution*.py"
      - "apps/api/app/integration_retry*.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/api/v7_*.py"
      - "apps/api/clinical_execution_smoke_test.py"
      - "apps/api/migrations/versions/*.py"
      - "apps/web/**"
      - "scripts/load-test-v7.py"
      - "scripts/failure-drill-v7.sh"
      - ".github/workflows/consolidation-clinical-v7-ci.yml"

jobs:
  api-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile consolidation and clinical modules
        run: python -m compileall -q app migrations
      - name: Secure session, realtime, shadow and retry test
        run: python v7_consolidation_smoke_test.py
      - name: Governed clinical execution test
        run: python clinical_execution_smoke_test.py
      - name: Verify v7 tables remain present after the current migration head
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-v7-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-v7-migration.db
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import inspect, text
          from app.database import engine

          required = {
              "authsession", "durableevent", "eventacknowledgement", "canonicalshadowcomparison",
              "integrationretryjob", "legacywriteretirement", "medicationorder", "medicationadministration",
              "anaesthesiarecord", "clinicalobservation", "treatmenttask", "controlleddrugledgerentry",
              "inventoryitem", "inventorymovement", "diagnosticworkitem", "samplechainevent", "dischargeplan",
          }
          missing = required - set(inspect(engine).get_table_names())
          assert not missing, sorted(missing)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          numeric_revision = int(str(version).split("_", 1)[0])
          assert numeric_revision >= 8, version
          print("v7 consolidation tables verified at current migration head", version)
          PY

  web-and-static-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Verify browser identity and same-origin API routing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          roots = [Path("apps/web/app"), Path("apps/web/components"), Path("apps/web/lib")]
          files = [path for root in roots for path in root.rglob("*") if path.suffix in {".ts", ".tsx", ".js", ".jsx"}]
          token_write = re.compile(r"localStorage\s*\.\s*setItem\s*\([^\n]*(accessToken|bearer|token)", re.I)
          permitted_fallback = 'const API_BASE = process.env.NEXT_PUBLIC_API_BASE || "http://localhost:8000";'
          violations = []
          fallback_count = 0

          for path in files:
              text = path.read_text(encoding="utf-8", errors="replace")
              for number, line in enumerate(text.splitlines(), 1):
                  if token_write.search(line):
                      violations.append(f"{path}:{number}: browser bearer/token persistence")
                  if "http://localhost:8000" in line:
                      if line.strip() != permitted_fallback:
                          violations.append(f"{path}:{number}: unsupported local API fallback: {line.strip()}")
                      else:
                          fallback_count += 1

          config = Path("apps/web/next.config.ts").read_text(encoding="utf-8")
          required_config = [
              'const legacyApiPrefix = "/_lucyworks_api";',
              "NEXT_PUBLIC_API_BASE: legacyApiPrefix",
              "source: `${legacyApiPrefix}/api/:path*`",
          ]
          for marker in required_config:
              if marker not in config:
                  violations.append(f"next.config.ts missing enforced same-origin marker: {marker}")

          if violations:
              raise SystemExit("\n".join(violations))
          print(f"Browser safety passed across {len(files)} files; {fallback_count} legacy constants are forced through the same-origin bridge")
          PY
      - name: Validate operational scripts
        run: |
          bash -n scripts/failure-drill-v7.sh scripts/restore-rehearsal.sh scripts/production-preflight.sh
          python -m py_compile scripts/load-test-v7.py
      - name: Build production web application
        working-directory: apps/web
        run: npm install --no-audit --no-fund && npm run build
