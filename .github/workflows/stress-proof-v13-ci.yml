name: Hospital Stress Proof v13 Check

on:
  pull_request:
    paths:
      - "apps/api/app/critical_result_deadline_*.py"
      - "apps/api/app/control_plane_*.py"
      - "apps/api/app/hospital_master_board_v11_*.py"
      - "apps/api/app/hospital_ops_*.py"
      - "apps/api/app/bvs_v6_rota_*.py"
      - "apps/api/app/referral_identity_v12_*.py"
      - "apps/api/critical_result_deadline_v13_smoke_test.py"
      - "apps/api/hospital_master_board_v11_smoke_test.py"
      - "apps/api/hospital_ops_v3_smoke_test.py"
      - "apps/api/bvs_v6_rota_smoke_test.py"
      - "apps/api/referral_identity_v12_smoke_test.py"
      - "apps/api/operational_proof_v13_smoke_test.py"
      - ".github/workflows/stress-proof-v13-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/critical_result_deadline_*.py"
      - "apps/api/app/control_plane_*.py"
      - "apps/api/app/hospital_master_board_v11_*.py"
      - "apps/api/app/hospital_ops_*.py"
      - "apps/api/app/bvs_v6_rota_*.py"
      - "apps/api/app/referral_identity_v12_*.py"
      - "apps/api/critical_result_deadline_v13_smoke_test.py"
      - "apps/api/hospital_master_board_v11_smoke_test.py"
      - "apps/api/hospital_ops_v3_smoke_test.py"
      - "apps/api/bvs_v6_rota_smoke_test.py"
      - "apps/api/referral_identity_v12_smoke_test.py"
      - "apps/api/operational_proof_v13_smoke_test.py"
      - ".github/workflows/stress-proof-v13-ci.yml"

jobs:
  hospital-stress-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile stress proof modules
        run: python -m py_compile app/critical_result_deadline_routes.py app/critical_result_deadline_patch.py critical_result_deadline_v13_smoke_test.py
      - name: Run connected referral-to-closure journey
        run: python operational_proof_v13_smoke_test.py 2>&1 | tee operational-proof-v13.log
      - name: Run emergency insertion and transactional displacement
        run: python hospital_master_board_v11_smoke_test.py 2>&1 | tee emergency-displacement-v13.log
      - name: Run imaging overrun propagation and contention
        run: python hospital_ops_v3_smoke_test.py 2>&1 | tee delay-propagation-v13.log
      - name: Run staff sickness and safe-coverage removal
        run: python bvs_v6_rota_smoke_test.py 2>&1 | tee staff-unavailable-v13.log
      - name: Run duplicate identity hold and accountable resolution
        run: python referral_identity_v12_smoke_test.py 2>&1 | tee duplicate-identity-v13.log
      - name: Run overdue critical-result deadline recovery
        run: python critical_result_deadline_v13_smoke_test.py 2>&1 | tee critical-result-deadline-v13.log
      - name: Upload stress proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-stress-proof-v13-logs
          path: |
            apps/api/operational-proof-v13.log
            apps/api/emergency-displacement-v13.log
            apps/api/delay-propagation-v13.log
            apps/api/staff-unavailable-v13.log
            apps/api/duplicate-identity-v13.log
            apps/api/critical-result-deadline-v13.log
          if-no-files-found: error
