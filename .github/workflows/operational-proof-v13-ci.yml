name: Operational Proof v13 Check

on:
  pull_request:
    paths:
      - "apps/api/operational_proof_v13_smoke_test.py"
      - "apps/api/app/input_routes.py"
      - "apps/api/app/referral_identity_v12_*.py"
      - "apps/api/app/hospital_command_*.py"
      - "apps/api/app/hospital_master_board_v11_routes.py"
      - "apps/api/app/role_queue_routes.py"
      - ".github/workflows/operational-proof-v13-ci.yml"
  push:
    branches: [main, "feature/**"]
    paths:
      - "apps/api/operational_proof_v13_smoke_test.py"
      - "apps/api/app/input_routes.py"
      - "apps/api/app/referral_identity_v12_*.py"
      - "apps/api/app/hospital_command_*.py"
      - "apps/api/app/hospital_master_board_v11_routes.py"
      - "apps/api/app/role_queue_routes.py"
      - ".github/workflows/operational-proof-v13-ci.yml"

jobs:
  connected-journey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile connected journey
        run: python -m py_compile operational_proof_v13_smoke_test.py app/input_routes.py app/referral_identity_v12_routes.py app/hospital_command_routes.py app/hospital_master_board_v11_routes.py app/role_queue_routes.py
      - name: Run referral-to-closure operational proof
        run: python operational_proof_v13_smoke_test.py 2>&1 | tee operational-proof-v13.log
      - name: Upload operational proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-proof-v13-log
          path: apps/api/operational-proof-v13.log
          if-no-files-found: error
