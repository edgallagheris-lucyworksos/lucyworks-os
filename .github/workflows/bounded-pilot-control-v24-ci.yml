name: Bounded Pilot Control v24 Check

on:
  pull_request:
    paths:
      - "apps/api/app/pilot_control_v24_*.py"
      - "apps/api/app/production_readiness_migration_head_v24_patch.py"
      - "apps/api/pilot_control_v24_smoke_*.py"
      - "apps/web/app/pilot-control/**"
      - "apps/web/app/system-control/page.tsx"
      - "apps/web/components/bounded-pilot-control-v24.tsx"
      - "scripts/validate_pilot_control_v24.py"
      - ".github/workflows/bounded-pilot-control-v24-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/pilot_control_v24_*.py"
      - "apps/api/app/production_readiness_migration_head_v24_patch.py"
      - "apps/api/pilot_control_v24_smoke_*.py"
      - "apps/web/app/pilot-control/**"
      - "apps/web/app/system-control/page.tsx"
      - "apps/web/components/bounded-pilot-control-v24.tsx"
      - "scripts/validate_pilot_control_v24.py"
      - ".github/workflows/bounded-pilot-control-v24-ci.yml"

jobs:
  pilot-authority-shadow-uat-stop-and-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Run v24 authority and clinical-boundary audit
        run: python scripts/validate_pilot_control_v24.py 2>&1 | tee bounded-pilot-control-v24-audit.log
      - name: Compile v24 API, readiness patch, migration and proof
        working-directory: apps/api
        run: >-
          python -m py_compile
          app/pilot_control_v24_models.py
          app/pilot_control_v24_service.py
          app/pilot_control_v24_routes.py
          app/production_readiness_migration_head_v24_patch.py
          pilot_control_v24_smoke_test.py
          pilot_control_v24_smoke_runner.py
          migrations/versions/0018_bounded_pilot_control_v24.py
          migrations/versions/0019_cross_system_safety_control_v25.py
          migrations/versions/0020_operational_convergence_v26.py
      - name: Run connected shadow-to-bounded-live recovery journey
        working-directory: apps/api
        run: python pilot_control_v24_smoke_runner.py 2>&1 | tee bounded-pilot-control-v24.log
      - name: Verify current migration head and pilot authority evidence tables
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          rm -f /tmp/lucyworks-pilot-v24-ci.db
          DATABASE_URL=sqlite:////tmp/lucyworks-pilot-v24-ci.db alembic upgrade head 2>&1 | tee pilot-migration-v24.log
          DATABASE_URL=sqlite:////tmp/lucyworks-pilot-v24-ci.db python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine('sqlite:////tmp/lucyworks-pilot-v24-ci.db')
          with engine.connect() as connection:
              version = connection.execute(text('select version_num from alembic_version')).scalar_one()
          expected_head = ScriptDirectory.from_config(Config('alembic.ini')).get_current_head()
          tables = set(inspect(engine).get_table_names())
          expected = {
              'pilotauthorityv24', 'pilotapprovalv24', 'pilotcontrolactionv24',
              'pilotshadowcomparisonv24', 'pilotuatscenariov24', 'safetyrecordv25',
              'canonicalcommandv26', 'activeoperatingcontextv26',
          }
          assert version == expected_head, (version, expected_head)
          assert expected <= tables, expected - tables
          print(f'BOUNDED_PILOT_V24_PASSED_AT_{expected_head}')
          PY
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build pilot and system-control surfaces
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build 2>&1 | tee bounded-pilot-web-v24.log
      - name: Upload v24 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-pilot-control-v24-evidence
          path: |
            bounded-pilot-control-v24-audit.log
            apps/api/bounded-pilot-control-v24.log
            apps/api/pilot-migration-v24.log
            apps/web/bounded-pilot-web-v24.log
          if-no-files-found: warn
