name: Recorded-State Automation Authority v21 Check

on:
  pull_request:
    paths:
      - "apps/api/app/main.py"
      - "apps/api/app/recorded_state_automation_v21_routes.py"
      - "apps/api/app/operational_automation_v20_routes.py"
      - "apps/api/recorded_state_automation_v21_smoke_test.py"
      - "apps/api/operational_automation_v20_smoke_test.py"
      - "scripts/validate_recorded_state_automation_v21.py"
      - "scripts/validate_operational_automation_v20.py"
      - ".github/workflows/recorded-state-automation-v21-ci.yml"
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "apps/api/app/main.py"
      - "apps/api/app/recorded_state_automation_v21_routes.py"
      - "apps/api/app/operational_automation_v20_routes.py"
      - "apps/api/recorded_state_automation_v21_smoke_test.py"
      - "apps/api/operational_automation_v20_smoke_test.py"
      - "scripts/validate_recorded_state_automation_v21.py"
      - "scripts/validate_operational_automation_v20.py"
      - ".github/workflows/recorded-state-automation-v21-ci.yml"

jobs:
  recorded-source-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Run recorded-state authority audit
        run: python scripts/validate_recorded_state_automation_v21.py 2>&1 | tee recorded-state-automation-v21-audit.log
      - name: Compile recorded-state authority routes and proof
        working-directory: apps/api
        run: >-
          python -m py_compile
          app/recorded_state_automation_v21_routes.py
          recorded_state_automation_v21_smoke_test.py
          operational_automation_v20_smoke_test.py
      - name: Run recorded observation, result and gate authority proof
        working-directory: apps/api
        run: python recorded_state_automation_v21_smoke_test.py 2>&1 | tee recorded-state-automation-v21.log
      - name: Run retained v20 safety audit
        run: python scripts/validate_operational_automation_v20.py 2>&1 | tee operational-automation-v20-regression-audit.log
      - name: Run retained v20 preview, delay and replay proof
        working-directory: apps/api
        run: python operational_automation_v20_smoke_test.py 2>&1 | tee operational-automation-v20-regression.log
      - name: Upload v21 authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-state-automation-v21-evidence
          path: |
            recorded-state-automation-v21-audit.log
            operational-automation-v20-regression-audit.log
            apps/api/recorded-state-automation-v21.log
            apps/api/operational-automation-v20-regression.log
          if-no-files-found: warn
