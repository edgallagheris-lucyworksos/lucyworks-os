name: Web security check

on:
  pull_request:
    paths:
      - "apps/web/package.json"
      - "apps/web/package-lock.json"
      - "apps/web/next.config.ts"
      - ".github/workflows/web-security-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-security:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependency graph
        run: npm install --ignore-scripts
      - name: Reject high production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Reject high full-tree vulnerabilities
        run: npm audit --audit-level=high
      - name: Build production web app
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
      - name: Commit validated package lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock already current"
          else
            git commit -m "Lock patched web dependency graph"
            git push origin HEAD:${{ github.head_ref }}
          fi
