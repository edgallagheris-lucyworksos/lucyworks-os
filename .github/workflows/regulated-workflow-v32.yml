name: Regulated Workflow v32 Check

on:
  pull_request:
    paths:
      - "apps/api/app/regulated_workflow_v32_*.py"
      - "apps/api/regulated_workflow_v32*_smoke_test.py"
      - "apps/api/migrations/versions/0025_regulated_workflow_v32.py"
      - ".github/workflows/regulated-workflow-v32.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/regulated_workflow_v32_*.py"
      - "apps/api/regulated_workflow_v32*_smoke_test.py"
      - "apps/api/migrations/versions/0025_regulated_workflow_v32.py"
      - ".github/workflows/regulated-workflow-v32.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regulated-workflow-v32:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile regulated workflow modules
        run: python -m compileall -q app/regulated_workflow_v32_models.py app/regulated_workflow_v32_extension_models.py app/regulated_workflow_v32_service.py app/regulated_workflow_v32_routes.py app/regulated_workflow_v32_extension_routes.py app/regulated_workflow_v32_middleware.py
      - name: Run estimate and AI governance acceptance test
        run: python regulated_workflow_v32_smoke_test.py
      - name: Run charge and client-governance acceptance test
        run: python regulated_workflow_v32_extension_smoke_test.py
      - name: Verify current migration head and governed tables
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-regulated-v32-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-regulated-v32-migration.db
          alembic upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine('sqlite:////tmp/lucyworks-regulated-v32-migration.db')
          required = {
              'servicepricev32', 'estimategovernancev32', 'aiprovenancev32',
              'chargeprovenancev32', 'complaintv32', 'prescriptionchoicev32',
          }
          tables = set(inspect(engine).get_table_names())
          assert not (required - tables), sorted(required - tables)
          expected_head = ScriptDirectory.from_config(Config('alembic.ini')).get_current_head()
          with engine.connect() as connection:
              version = connection.execute(text('select version_num from alembic_version')).scalar_one()
          assert version == expected_head, (version, expected_head)
          print(f'Regulated workflow v32 tables verified at current head {expected_head}')
          PY
