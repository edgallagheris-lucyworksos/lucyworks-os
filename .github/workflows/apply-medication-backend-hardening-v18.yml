name: Apply Medication Backend Hardening v18

on:
  pull_request:
    paths:
      - ".github/workflows/apply-medication-backend-hardening-v18.yml"
      - "scripts/apply_medication_backend_hardening_v18.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/medication-foundation-v18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Apply deterministic backend hardening
        run: python scripts/apply_medication_backend_hardening_v18.py
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile and prove medication backend
        working-directory: apps/api
        run: |
          python -m py_compile app/medication_foundation_v18_routes.py
          python medication_v18_vmd_parser_test.py
          python medication_foundation_v18_smoke_test.py
      - name: Commit verified source change
        run: |
          git config user.name "lucyworks-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/api/app/medication_foundation_v18_routes.py
          git diff --cached --quiet && { echo "Backend hardening produced no change"; exit 1; }
          git commit -m "Harden medication catalogue normalisation v18"
          git push origin HEAD:feature/medication-foundation-v18
