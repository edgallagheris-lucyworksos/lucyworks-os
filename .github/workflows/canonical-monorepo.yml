name: Canonical Monorepo Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    name: Canonical monorepo full check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/shared/package-lock.json
      - name: Prove canonical connected LucyWorks monorepo
        run: npm run check
