name: Canonical Monorepo Acceptance

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "AGENTS.md"
      - "PRODUCT_CONTRACT.md"
      - "package.json"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/canonical-monorepo.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docs/**"
      - "AGENTS.md"
      - "PRODUCT_CONTRACT.md"
      - "package.json"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/canonical-monorepo.yml"

concurrency:
  group: canonical-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/shared/package-lock.json
      - name: Prove canonical connected LucyWorks monorepo
        run: npm run check
