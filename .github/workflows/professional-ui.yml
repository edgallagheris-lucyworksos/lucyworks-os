name: Professional UI Acceptance

on:
  pull_request:
    paths:
      - "apps/web/app/hospital-board/**"
      - "apps/web/app/workspace/**"
      - "apps/web/app/referral-intake/**"
      - "apps/web/app/care/**"
      - "apps/web/app/patient-record/**"
      - "apps/web/app/clinical-execution/**"
      - "apps/web/app/system-control/**"
      - "apps/web/components/responsive-hospital-board-v15.tsx"
      - "apps/web/components/hospital-value-panel.tsx"
      - "apps/web/components/episode-command-shell.tsx"
      - "apps/web/components/auth-guard.tsx"
      - "apps/web/components/guided-referral-intake-v31.tsx"
      - "apps/web/components/workspace-professional-shell.tsx"
      - "apps/web/components/operational-workspace-v16.tsx"
      - "apps/web/components/care-brief-v16.tsx"
      - "apps/web/lib/operational-context.ts"
      - "apps/web/tests/ui/**"
      - "apps/web/playwright.config.ts"
      - "apps/web/package.json"
      - "scripts/validate_professional_ui.py"
      - ".github/workflows/professional-ui.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/app/hospital-board/**"
      - "apps/web/app/workspace/**"
      - "apps/web/app/referral-intake/**"
      - "apps/web/app/care/**"
      - "apps/web/app/patient-record/**"
      - "apps/web/app/clinical-execution/**"
      - "apps/web/app/system-control/**"
      - "apps/web/components/responsive-hospital-board-v15.tsx"
      - "apps/web/components/hospital-value-panel.tsx"
      - "apps/web/components/episode-command-shell.tsx"
      - "apps/web/components/auth-guard.tsx"
      - "apps/web/components/guided-referral-intake-v31.tsx"
      - "apps/web/components/workspace-professional-shell.tsx"
      - "apps/web/components/operational-workspace-v16.tsx"
      - "apps/web/components/care-brief-v16.tsx"
      - "apps/web/lib/operational-context.ts"
      - "apps/web/tests/ui/**"
      - "apps/web/playwright.config.ts"
      - "apps/web/package.json"
      - "scripts/validate_professional_ui.py"
      - ".github/workflows/professional-ui.yml"

concurrency:
  group: professional-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate professional presentation contract
        run: python scripts/validate_professional_ui.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - name: Build responsive hospital product
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
          NEXT_PUBLIC_PREMISES_REF: default-premises
          NEXT_PUBLIC_SITE_NAME: Referral Hospital
        run: npm run build

  rendered-ui:
    name: Rendered desktop tablet and phone proof
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build browser-test product
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:3000
          NEXT_PUBLIC_PREMISES_REF: hospital-main
          NEXT_PUBLIC_SITE_NAME: Bristol Referral Hospital
        run: npm run build
      - name: Render primary staff surfaces
        env:
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:3000
          NEXT_PUBLIC_PREMISES_REF: hospital-main
          NEXT_PUBLIC_SITE_NAME: Bristol Referral Hospital
        run: mkdir -p test-results/screenshots && npm run test:ui
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucyworks-professional-ui-${{ github.sha }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
