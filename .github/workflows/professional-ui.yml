name: Professional UI Acceptance

on:
  pull_request:
    paths:
      - "apps/web/app/hospital-board/**"
      - "apps/web/app/workspace/**"
      - "apps/web/app/referral-intake/**"
      - "apps/web/components/responsive-hospital-board-v15.tsx"
      - "apps/web/components/hospital-value-panel.tsx"
      - "apps/web/components/episode-command-shell.tsx"
      - "apps/web/components/auth-guard.tsx"
      - "apps/web/components/guided-referral-intake-v31.tsx"
      - "apps/web/components/workspace-professional-shell.tsx"
      - "apps/web/lib/operational-context.ts"
      - "scripts/validate_professional_ui.py"
      - ".github/workflows/professional-ui.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/app/hospital-board/**"
      - "apps/web/app/workspace/**"
      - "apps/web/app/referral-intake/**"
      - "apps/web/components/responsive-hospital-board-v15.tsx"
      - "apps/web/components/hospital-value-panel.tsx"
      - "apps/web/components/episode-command-shell.tsx"
      - "apps/web/components/auth-guard.tsx"
      - "apps/web/components/guided-referral-intake-v31.tsx"
      - "apps/web/components/workspace-professional-shell.tsx"
      - "apps/web/lib/operational-context.ts"
      - "scripts/validate_professional_ui.py"
      - ".github/workflows/professional-ui.yml"

concurrency:
  group: professional-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate professional presentation contract
        run: python scripts/validate_professional_ui.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - name: Build responsive hospital product
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
          NEXT_PUBLIC_PREMISES_REF: default-premises
          NEXT_PUBLIC_SITE_NAME: Referral Hospital
        run: npm run build
