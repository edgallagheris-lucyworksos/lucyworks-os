name: Apply Operational UX v17

on:
  push:
    branches:
      - fix/operational-ux-p1-v17
    paths:
      - ".github/workflows/apply-operational-ux-v17.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operational-ux-p1-v17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Apply deterministic source transformations
        run: python scripts/apply_operational_ux_v17.py
      - name: Validate operational context and governed forms
        run: python scripts/validate_operational_ux_v17.py
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build web application
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
      - name: Compile API application
        working-directory: apps/api
        run: python -m compileall -q app
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo "No source changes produced"
            exit 1
          fi
          git config user.name "lucyworks-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web scripts
          git commit -m "Fix episode context and governed mobile forms v17"
          git push origin HEAD:fix/operational-ux-p1-v17
