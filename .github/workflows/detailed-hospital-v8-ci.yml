name: Detailed Hospital Record v8 Check

on:
  pull_request:
    paths:
      - "apps/api/app/detailed_hospital_*.py"
      - "apps/api/detailed_hospital*_smoke_test.py"
      - "apps/api/migrations/versions/0009_*.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/web/app/patient-record/**"
      - "apps/web/components/detailed-patient-record-workspace.tsx"
      - "docs/validation/DETAILED_HOSPITAL_RECORD_V8_RUNBOOK.md"
      - ".github/workflows/detailed-hospital-v8-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/app/detailed_hospital_*.py"
      - "apps/api/detailed_hospital*_smoke_test.py"
      - "apps/api/migrations/versions/0009_*.py"
      - "apps/api/app/legacy_write_retirement.py"
      - "apps/web/app/patient-record/**"
      - "apps/web/components/detailed-patient-record-workspace.tsx"
      - "docs/validation/DETAILED_HOSPITAL_RECORD_V8_RUNBOOK.md"
      - ".github/workflows/detailed-hospital-v8-ci.yml"

jobs:
  api-and-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile detailed hospital modules
        run: python -m compileall -q app migrations
      - name: Run complete synthetic patient journey
        id: journey
        continue-on-error: true
        run: python detailed_hospital_v8_smoke_test.py > detailed-v8.log 2>&1
      - name: Run connected prescribing, anaesthesia transition and document-delivery gates
        id: completion
        continue-on-error: true
        run: python detailed_hospital_completion_smoke_test.py > detailed-completion.log 2>&1
      - name: Verify v8 tables remain present after current SQLite migration head
        id: migration
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:////tmp/lucyworks-detailed-v8-migration.db
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f /tmp/lucyworks-detailed-v8-migration.db
          {
            alembic upgrade head
            python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import inspect, text
          from app.database import engine
          required = {
              "owneraccountv8", "patientclinicalrecordv8", "patientownerlinkv8", "patientproblemv8",
              "patientallergyv8", "patientweightv8", "clinicalencounterv8", "clinicalnotev8",
              "formularymedicinev8", "formularydoserulev8", "medicationsafetyreviewv8",
              "anaesthesiachartv8", "anaesthesiaobservationv8", "anaesthesiadrugeventv8",
              "fluidplanv8", "fluidbalanceentryv8", "inpatientcareplanv8", "inpatientchartentryv8",
              "procedurerecordv8", "implanttracev8", "estimatev8", "estimatelinev8",
              "insurancecasev8", "financialtransactionv8", "communicationeventv8", "clinicaldocumentv8",
          }
          tables = set(inspect(engine).get_table_names())
          assert not (required - tables), sorted(required - tables)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          expected = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          assert version == expected, (version, expected)
          print("SQLite v8 tables verified at current migration head", version)
          PY
          } > migration.log 2>&1
      - name: Upload detailed API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-hospital-v8-api-logs
          path: |
            apps/api/detailed-v8.log
            apps/api/detailed-completion.log
            apps/api/migration.log
          if-no-files-found: error
      - name: Report detailed API failure
        if: steps.journey.outcome == 'failure' || steps.completion.outcome == 'failure' || steps.migration.outcome == 'failure'
        run: |
          for file in detailed-v8.log detailed-completion.log migration.log; do
            echo "--- $file ---"
            cat "$file" || true
          done
          exit 1

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lucyworks
          POSTGRES_PASSWORD: lucyworks
          POSTGRES_DB: lucyworks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucyworks -d lucyworks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://lucyworks:lucyworks@localhost:5432/lucyworks_test
      AUTO_CREATE_SCHEMA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Apply current PostgreSQL migration head
        id: postgres_migration
        continue-on-error: true
        run: alembic upgrade head > postgres-v8.log 2>&1
      - name: Verify PostgreSQL v8 tables remain present
        id: postgres_verify
        if: steps.postgres_migration.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY' >> postgres-v8.log 2>&1
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import inspect, text
          from app.database import engine
          required = {
              "owneraccountv8", "patientclinicalrecordv8", "patientownerlinkv8", "patientproblemv8",
              "patientallergyv8", "patientweightv8", "clinicalencounterv8", "clinicalnotev8",
              "formularymedicinev8", "formularydoserulev8", "medicationsafetyreviewv8",
              "anaesthesiachartv8", "anaesthesiaobservationv8", "anaesthesiadrugeventv8",
              "fluidplanv8", "fluidbalanceentryv8", "inpatientcareplanv8", "inpatientchartentryv8",
              "procedurerecordv8", "implanttracev8", "estimatev8", "estimatelinev8",
              "insurancecasev8", "financialtransactionv8", "communicationeventv8", "clinicaldocumentv8",
          }
          missing = required - set(inspect(engine).get_table_names())
          assert not missing, sorted(missing)
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar_one()
          expected = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          assert version == expected, (version, expected)
          print("PostgreSQL v8 tables verified at current migration head", version)
          PY
      - name: Upload PostgreSQL v8 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-hospital-v8-postgres-log
          path: apps/api/postgres-v8.log
          if-no-files-found: error
      - name: Report PostgreSQL v8 failure
        if: steps.postgres_migration.outcome == 'failure' || steps.postgres_verify.outcome == 'failure'
        run: |
          cat postgres-v8.log || true
          exit 1

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install --no-audit --no-fund
      - name: Build detailed patient record UI
        run: npm run build
