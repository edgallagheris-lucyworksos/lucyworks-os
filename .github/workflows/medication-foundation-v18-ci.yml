name: Medication Foundation v18 Check

on:
  pull_request:
    paths:
      - "apps/api/app/main.py"
      - "apps/api/app/medication_foundation_v18_models.py"
      - "apps/api/app/medication_foundation_v18_routes.py"
      - "apps/api/migrations/versions/**"
      - "apps/api/medication_foundation_v18_smoke_test.py"
      - "apps/api/medication_v18_vmd_parser_test.py"
      - "apps/web/app/medications/**"
      - "apps/web/app/care/layout.tsx"
      - "apps/web/app/patient-record/layout.tsx"
      - "apps/web/app/clinical-execution/layout.tsx"
      - "apps/web/app/system-control/layout.tsx"
      - "apps/web/components/medication-**"
      - "apps/web/components/speech-**"
      - "scripts/restore-rehearsal.sh"
      - ".github/workflows/medication-foundation-v18-ci.yml"
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "apps/api/app/main.py"
      - "apps/api/app/medication_foundation_v18_models.py"
      - "apps/api/app/medication_foundation_v18_routes.py"
      - "apps/api/migrations/versions/**"
      - "apps/api/medication_foundation_v18_smoke_test.py"
      - "apps/api/medication_v18_vmd_parser_test.py"
      - "apps/web/app/medications/**"
      - "apps/web/app/care/layout.tsx"
      - "apps/web/app/patient-record/layout.tsx"
      - "apps/web/app/clinical-execution/layout.tsx"
      - "apps/web/app/system-control/layout.tsx"
      - "apps/web/components/medication-**"
      - "apps/web/components/speech-**"
      - "scripts/restore-rehearsal.sh"
      - ".github/workflows/medication-foundation-v18-ci.yml"

jobs:
  medication-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip -q && pip install -q -r requirements.txt
      - name: Compile medication foundation
        working-directory: apps/api
        run: python -m py_compile app/medication_foundation_v18_models.py app/medication_foundation_v18_routes.py medication_foundation_v18_smoke_test.py medication_v18_vmd_parser_test.py migrations/versions/0013_medication_foundation_v18.py migrations/versions/0018_bounded_pilot_control_v24.py migrations/versions/0019_cross_system_safety_control_v25.py migrations/versions/0020_operational_convergence_v26.py
      - name: Run VMD-style parser proof
        working-directory: apps/api
        run: python medication_v18_vmd_parser_test.py 2>&1 | tee medication-vmd-parser-v18.log
      - name: Run connected catalogue-to-administration proof
        working-directory: apps/api
        run: python medication_foundation_v18_smoke_test.py 2>&1 | tee medication-foundation-v18.log
      - name: Verify current migration head and v18 tables
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail
          rm -f /tmp/lucyworks-medication-v18-ci.db
          DATABASE_URL=sqlite:////tmp/lucyworks-medication-v18-ci.db alembic upgrade head 2>&1 | tee medication-migration-v18.log
          DATABASE_URL=sqlite:////tmp/lucyworks-medication-v18-ci.db python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine('sqlite:////tmp/lucyworks-medication-v18-ci.db')
          expected = {'productimportbatchv18', 'veterinaryproductv18', 'medicationprotocolv18', 'dosecalculationv18', 'medicationproposalv18', 'safetyrecordv25', 'canonicalcommandv26'}
          with engine.connect() as connection:
              version = connection.execute(text('select version_num from alembic_version')).scalar_one()
          assert version == '0023_hospital_pilot_v29', version
          missing = expected - set(inspect(engine).get_table_names())
          assert not missing, missing
          print('MEDICATION_MIGRATION_V18_PASSED_AT_0023')
          PY
      - name: Validate restore rehearsal
        run: |
          bash -n scripts/restore-rehearsal.sh
          grep -q '0023_hospital_pilot_v29' scripts/restore-rehearsal.sh
          grep -q 'canonicalcommandv26' scripts/restore-rehearsal.sh
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build medication product surfaces
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build 2>&1 | tee medication-web-v18.log
      - name: Upload medication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medication-foundation-v18-evidence
          path: |
            apps/api/medication-vmd-parser-v18.log
            apps/api/medication-foundation-v18.log
            apps/api/medication-migration-v18.log
            apps/web/medication-web-v18.log
          if-no-files-found: warn
